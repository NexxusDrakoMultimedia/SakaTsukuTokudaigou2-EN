#
# What tools/release.py checks the source disc against and records in a release (analogue of LMASTER-Mod's
# release.toml). The version (single source of truth, semver) is in tools/VERSION. The hashes are of the repo's own Redump-style multi-bin
# source disc (the 5 track files in the repo root) as measured here; compare them with the Redump entry of
# the game before publishing (not done by the tooling: Redump's database is not consulted).
# Regenerate with:  python -I -X utf8 tools/release.py --print-source-toml

[release]
project = "SakaTsuku2-EN"
title = "Sakatsuku Tokudaigou 2 - J.League Pro Soccer Club o Tsukurou! (Japan)"
product = "HDR-0183"

# The build flags of a release (tools/release.py passes them to tools/build_patch.py when no build option is given on its command line; options given
# on the command line REPLACE this list).  Together with the command-line defaults of build_patch.py they give exactly the flags of the
# trial disc prop10j that was checked on screen:
#   --repack on --share dup --append-safe --proportional-font on --refit on --align-fix on --tag-fix on --scout-fix on --crowd-fix on --bcast-speed 1.9
#   --lin-center on --cell-prop on --money-format on --prop-scale off --strict --texture-policy exact --open-font on --small-prop on --options-fix on --clip-lead-space on
# --repack on, --share dup, --append-safe, --proportional-font on, --open-font on, --small-prop on and --strict are not defaults of build_patch.py and stay explicit
# here on purpose; --refit on and --align-fix on are repeated for clarity; the other flags of the list are defaults of build_patch.py and are not repeated.
# --name-entry-order half-first (the Name Entry ABC/123 tab opens on the half-width letters; added after prop10j) is a default of build_patch.py too, so it is not listed;
# a release that wants the Japanese disc order adds --name-entry-order original to standard_flags.
[build]
standard_flags = ["--repack", "on", "--share", "dup", "--append-safe", "--proportional-font", "on", "--refit", "on", "--align-fix", "on", "--open-font", "on", "--small-prop", "on", "--strict"]

# The release bundle carries the translators' notes and player guide (doc/TRANSLATORS_NOTES.md, real text since 0.1.0). release.py fails the bundle while the
# file does not exist or still contains the marker PLACEHOLDER (--allow-placeholder for development bundles).
[bundle]
translators_notes = "doc/TRANSLATORS_NOTES.md"
# The changelog (Keep a Changelog) must have a "## [<version>]" section for a real release; the licence texts (REUSE layout) are copied into the bundle.
changelog = "CHANGELOG.md"
licenses_dir = "LICENSES"

